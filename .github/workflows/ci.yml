name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n scripts/*.sh laptop/*.sh launchd/*.sh
          shellcheck scripts/*.sh laptop/*.sh launchd/*.sh
